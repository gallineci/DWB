<!-- templates/anuncio/novo.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Anúncio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-5 mb-4">
        <a class="navbar-brand" href="/">Página Inicial</a>
        <div class="navbar-nav">
            <div class="nav-item dropdown mx-2">
                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Veículos</a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="/veiculo">Listar</a>
                    <a class="dropdown-item" href="/veiculo/novo">Cadastrar</a>
                </div>
            </div>
            <div class="nav-item dropdown mx-2">
                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Anúncios</a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="/anuncio">Listar</a>
                    <a class="dropdown-item" href="/anuncio/novo">Cadastrar</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Cadastrar Novo Anúncio</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/anuncio" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
